name: jobtracker-e2e-${E2E_RUN_ID:?Approved E2E run ID required}

services:
  db:
    image: postgres:17
    restart: "no"
    environment:
      POSTGRES_USER: jobtracker_stack
      POSTGRES_DB: jobtracker_stack_${E2E_RUN_ID:?Approved E2E run ID required}
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?Private E2E password required}
    volumes:
      - e2e_pgdata:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker_stack -d jobtracker_stack_${E2E_RUN_ID}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      APP_ENV: development
      APP_DATABASE_MODE: stack
      STACK_RUN_ID: ${E2E_RUN_ID:?Approved E2E run ID required}
      E2E_RUN_ID: ${E2E_RUN_ID:?Approved E2E run ID required}
      E2E_FRONTEND_PORT: ${E2E_FRONTEND_PORT:?Approved frontend port required}
      STACK_DATABASE_NAME: jobtracker_stack_${E2E_RUN_ID:?Approved E2E run ID required}
      STACK_DATABASE_HOST: db
      STACK_DATABASE_PORT: "5432"
      STACK_DATABASE_USER: jobtracker_stack
      STACK_POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?Private E2E password required}
      CSRF_HMAC_SECRET: ${E2E_CSRF_HMAC_SECRET:?Private E2E CSRF secret required}
      AUTH_ALLOWED_ORIGINS: http://localhost:${E2E_FRONTEND_PORT:?Approved frontend port required}
      VERIFICATION_FRONTEND_ORIGIN: http://localhost:${E2E_FRONTEND_PORT:?Approved frontend port required}
      SESSION_COOKIE_SECURE: "false"
      EMAIL_DELIVERY_MODE: stack-capture
      DEV_EMAIL_VERIFICATION_PREVIEW: "false"
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, private, mail]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "127.0.0.1:${E2E_FRONTEND_PORT:?Approved frontend port required}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  capture:
    image: docker.io/axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      MP_DATABASE: /data/mailpit.db
    tmpfs: [/data, /tmp]
    ports:
      - "127.0.0.1:${E2E_MAIL_UI_PORT:?Approved Mailpit UI port required}:8025"
    networks: [mail]

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
    internal: true
  mail:
    driver: bridge

volumes:
  e2e_pgdata:
