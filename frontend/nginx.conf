pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    # A non-root worker writes temporary data only beneath /tmp.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Vite already distinguishes this shared page/API path by the Accept header.
    map "$request_method:$http_accept" $applications_spa {
        default 0;
        ~*^GET:.*text/html 1;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 64k;

        # Keep the original method, URI/query, cookies, Origin, and CSRF header.
        # Set forwarding headers explicitly rather than trusting client-supplied ones.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_intercept_errors off;

        location = /applications {
            if ($applications_spa) {
                rewrite ^ /index.html last;
            }
            proxy_pass http://backend:8000;
            add_header Cache-Control "no-store" always;
        }

        location = /applications/ {
            if ($applications_spa) {
                rewrite ^ /index.html last;
            }
            proxy_pass http://backend:8000;
            add_header Cache-Control "no-store" always;
        }

        location ~ ^/(?:auth(?:/|$)|applications/) {
            proxy_pass http://backend:8000;
            add_header Cache-Control "no-store" always;
        }

        location = /health {
            proxy_pass http://backend:8000;
            add_header Cache-Control "no-store" always;
        }

        location = /health/db {
            proxy_pass http://backend:8000;
            add_header Cache-Control "no-store" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
