
services:
  db:
    image: postgres:17
    container_name: job-tracker-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jobtracker_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
